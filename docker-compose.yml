services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-escuela}
      POSTGRES_USER: ${POSTGRES_USER:-escuela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escuela}
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escuela} -d ${POSTGRES_DB:-escuela}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-escuela}:${POSTGRES_PASSWORD:-escuela}@db:5432/${POSTGRES_DB:-escuela}
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-por-una-larga-y-aleatoria}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CARGAR_DATOS_DEMO: ${CARGAR_DATOS_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: America/Mexico_City
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-8080}:80"

volumes:
  pgdata:
  backups:
